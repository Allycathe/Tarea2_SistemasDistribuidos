services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-setup:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka_setup
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      echo 'Esperando Kafka...'
      sleep 10
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic consultas-principales --partitions 8 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic consultas-reintento   --partitions 1 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic dlq                   --partitions 1 --replication-factor 1
      echo 'Topicos creados'
      "
    networks:
      - app-network
    restart: on-failure

  cache:
    image: redis:7.2-alpine
    container_name: sistema_cache
    command: redis-server --maxmemory ${REDIS_MAX_MEMORY:-200mb} --maxmemory-policy ${REDIS_POLICY:-allkeys-lru}
    ports:
      - "6379:6379"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  generador_respuestas:
    build: ./respuestas
    container_name: servicio_respuestas
    volumes:
      - ./dataset:/app/data
    environment:
      - REDIS_HOST=cache
      - REDIS_PORT=6379
      - DATASET_PATH=/app/data/buildings.csv
      - FORCE_COLOR=1
      - FALLA_RATE=${FALLA_RATE:-0.0}
      - LATENCY_MS=${LATENCY_MS:-0}
    networks:
      - app-network
    depends_on:
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import redis; r=redis.Redis(host='cache', port=6379); exit(0) if r.get('status:engine_ready') else exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  consumer:
    build: ./consumidores
    environment:
      - REDIS_HOST=cache
      - REDIS_PORT=6379
      - KAFKA_HOST=kafka:9092
      - MAX_REINTENTOS=${MAX_REINTENTOS:-3}
      - FORCE_COLOR=1
    networks:
      - app-network
    depends_on:
      kafka:
        condition: service_healthy
      cache:
        condition: service_healthy
      generador_respuestas:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully

  consumer_retry:
    build: ./consumidores
    container_name: consumer_reintento
    command: ["python", "reintentos.py"]
    environment:
      - REDIS_HOST=cache
      - REDIS_PORT=6379
      - KAFKA_HOST=kafka:9092
      - MAX_REINTENTOS=${MAX_REINTENTOS:-3}
      - FORCE_COLOR=1
    networks:
      - app-network
    depends_on:
      kafka:
        condition: service_healthy
      cache:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully

  consumer_dlq:
    build: ./consumidores
    container_name: consumer_dlq
    command: ["python", "-u", "dlq.py"]
    environment:
      - REDIS_HOST=cache
      - REDIS_PORT=6379
      - KAFKA_HOST=kafka:9092
      - FORCE_COLOR=1
    networks:
      - app-network
    depends_on:
      kafka:
        condition: service_healthy
      cache:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully

  generador_trafico:
    build: ./trafico
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=cache
      - REDIS_PORT=6379
      - KAFKA_HOST=kafka:9092
      - SIMULATION_MODE=${SIMULATION_MODE:-uniforme}
      - N_PEDIDOS=${N_PEDIDOS:-5000}
      - DELAY_MS=${DELAY_MS:-5}
      - SPIKE_ENABLED=${SPIKE_ENABLED:-false}
      - SPIKE_EN_PEDIDO=${SPIKE_EN_PEDIDO:-2500}
      - SPIKE_DURACION=${SPIKE_DURACION:-500}
      - SPIKE_DELAY_MS=${SPIKE_DELAY_MS:-1}
      - MODO_TRANSPORTE=${MODO_TRANSPORTE:-kafka}
      - FORCE_COLOR=1
    networks:
      - app-network
    depends_on:
      cache:
        condition: service_healthy
      generador_respuestas:
        condition: service_healthy

  metricas:
    build: ./metricas
    container_name: servicio_metricas
    environment:
      - REDIS_HOST=cache
      - REDIS_PORT=6379
      - KAFKA_HOST=kafka:9092
      - MODO_METRICAS=${MODO_METRICAS:-uniforme}
      - ESCENARIO=${ESCENARIO:-base}
      - FORCE_COLOR=1
    networks:
      - app-network
    depends_on:
      cache:
        condition: service_healthy
    volumes:
      - ./resultados:/app/resultados

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka_ui
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=Cluster-Local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
      - DYNAMIC_CONFIG_ENABLED=true
    networks:
      - app-network
    depends_on:
      kafka:
        condition: service_healthy

networks:
  app-network:
    driver: bridge